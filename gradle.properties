# Fixes the :checkDebugAarMetadata error by enabling AndroidX support
android.useAndroidX=true

# Optimizes memory for the Gradle daemon on GitHub Actions runners and local machines
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Improves build speeds with parallel task execution and caching
org.gradle.parallel=true
org.gradle.caching=true

# Modern Android Gradle Plugin and Kotlin Multiplatform settings
android.nonTransitiveRClass=true
kotlin.mpp.androidSourceSetLayoutVersion=2
